<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta property="og:site_name" content="The New Division" />
  <link rel="preconnect" href="https://thenewdivision.cdn.prismic.io" />
  <link rel="preconnect" href="https://images.prismic.io" />
  <script>document.documentElement.setAttribute('scripting-enabled', '')</script>
  <meta name="theme-color" content="#010101" />
  <link rel="icon" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@thenewdiv" />
  <meta name="twitter:creator" content="@thenewdiv" />
  <!-- No-CSS usability styles (ported from lib/document.js) -->
  <style>
    html {
      font-family: -apple-system, "BlinkMacSystemFont", "Segoe UI", "Roboto", "Helvetica", "Arial", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    }
    body {
      margin: 0 auto;
      padding: 5rem 2rem;
      max-width: 40rem;
    }
    img, video, svg {
      max-width: 100%;
      height: auto;
    }
    [role="presentation"],
    [aria-hidden="true"] {
      display: none;
    }
  </style>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div id="app" style="display: contents">%sveltekit.body%</div>
</body>
</html>
